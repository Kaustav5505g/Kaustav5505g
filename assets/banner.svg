<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Kaustav Paul banner</title>
  <desc id="desc">A dark blue gradient banner with the name Kaustav Paul and the subtitle AI/ML Engineer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#background)"/>
  <circle cx="1010" cy="70" r="150" fill="#58a6ff" opacity=".08"/>
  <circle cx="1100" cy="220" r="110" fill="#a371f7" opacity=".12"/>
  <path d="M0 225 C260 190 430 275 690 225 S1030 175 1200 215" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".8"/>
  <text x="72" y="115" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">KAUSTAV PAUL</text>
  <text x="76" y="160" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="23">AI/ML Engineer</text>
</svg>
