<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-label="Glowing line with a moving pink pulse">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00FF9C" stop-opacity=".8"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 16 H1200" fill="none" stroke="url(#line)" stroke-width="2"/>
  <circle cx="0" cy="16" r="5" fill="#FF2BD6" filter="url(#glow)">
    <animate attributeName="cx" values="0;1200;0" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
